<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini WMS</title>
<!-- Barcode engine (ZXing) for phones without a built-in reader, e.g. iPhone. Android Chrome uses its own. -->
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: system-ui, Arial, sans-serif; background: #f4f5f7; color: #222; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: #555; text-transform: uppercase; letter-spacing: .04em; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  #sync { font-size: 13px; font-weight: 600; color: #137333; text-align: right; }
  #sync.saving { color: #b06000; }
  #sync.err { color: #c5221f; }
  #verBanner { background: #c5221f; color: #fff; font-weight: 700; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
  .who { font-size: 13px; color: #444; margin: -6px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .who b { color: #1a56c4; }
  .linkbtn { background: none; border: 0; color: #c5221f; font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px 0; }
  .linkbtn.sound { color: #1a56c4; margin-right: 14px; }
  #login .dlgbox { border-top: 8px solid #1a56c4; }
  #login h3 { margin: 0 0 6px; font-size: 20px; }
  #loginMsg { min-height: 22px; color: #c5221f; font-weight: 600; margin: 8px 0; }

  .modes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
  .modes button { grid-column: span 2; border: 3px solid transparent; border-radius: 10px; padding: 14px 4px; font-size: 17px;
                  font-weight: 700; color: #fff; cursor: pointer; opacity: .55; line-height: 1.15; }
  .modes button.wide { grid-column: span 3; font-size: 15px; }
  .modes button.active { opacity: 1; border-color: #222; }
  .modes button[data-mode="add"] { background: #1e9e48; }
  .modes button[data-mode="remove"] { background: #d93025; }
  .modes button[data-mode="manual"] { background: #6b7280; }
  .modes button[data-mode="pick"] { background: #1a56c4; }
  .modes button[data-mode="inv"] { background: #7c3aed; }

  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, select { width: 100%; font-size: 20px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; background: #fff; }
  select { font-weight: 700; }
  input:focus, select:focus { border-color: #1a73e8; outline: none; }
  select.missing { border-color: #d93025; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn { padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer; font-weight: 600; }
  .btn.sec { background: #e0e0e0; color: #222; }
  .btn.yes { background: #1e9e48; }
  .btn.move { background: #b06000; }
  .btn.big { padding: 16px; font-size: 18px; font-weight: 800; }
  .btn:disabled { opacity: .45; cursor: default; }
  .cam { flex: 0 0 auto; }
  .undo { display: block; width: 100%; margin-top: 8px; padding: 14px; font-size: 18px; font-weight: 800; letter-spacing: .04em;
          color: #fff; background: #ff1a1a; border: 0; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 0 #b80000; }
  .undo:active { transform: translateY(2px); box-shadow: none; }
  .undo:disabled { background: #f3a5a5; box-shadow: none; cursor: default; }
  .hint { font-size: 12px; color: #777; margin-top: 4px; }

  #msg { margin: 12px 0; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; min-height: 46px; }
  #msg.ok { background: #e6f4ea; color: #137333; }
  #msg.err { background: #fce8e6; color: #c5221f; }
  #msg.info { background: #e8f0fe; color: #1a56c4; }
  .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 10px; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .brand { font-size: 15px; font-weight: 600; color: #1a56c4; margin-top: 2px; }
  .card .meta { color: #555; margin-top: 4px; }
  .card .qty { font-size: 40px; font-weight: 800; margin-top: 6px; }

  /* Camera: a strip about as tall as a barcode, with a red aiming line, and the SCAN trigger under it */
  #reader { position: relative; height: 130px; margin-top: 10px; overflow: hidden; border-radius: 8px; background: #000;
            border: 3px solid #000; transition: border-color .15s; }
  #reader.hit { border-color: #1e9e48; }
  #reader video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reader::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; border-top: 2px solid #ff1a1a;
                   box-shadow: 0 0 6px #ff1a1a; pointer-events: none; }
  .camtools { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; z-index: 2; }
  .camtools button { background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 6px;
                     font-size: 14px; font-weight: 700; padding: 6px 9px; cursor: pointer; }
  .camtools button.on { background: #f5c400; color: #000; }
  .scanbtn { display: block; width: 100%; margin-top: 8px; padding: 18px; font-size: 22px; font-weight: 900; letter-spacing: .08em;
             color: #fff; background: #1e9e48; border: 0; border-radius: 10px; cursor: pointer; box-shadow: 0 3px 0 #11692f; }
  .scanbtn:active { transform: translateY(2px); box-shadow: none; }
  .scanbtn.busy { background: #11692f; }

  /* Questions (YES / NO, or several choices) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dlgbox { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 440px; box-shadow: 0 8px 30px rgba(0,0,0,.3); outline: none;
            max-height: 92vh; overflow-y: auto; }
  .dlgbox.warn { border-top: 8px solid #d93025; }
  .dlgbox.ask { border-top: 8px solid #1a56c4; }
  #dlgText { font-size: 17px; line-height: 1.4; margin-bottom: 16px; }
  #dlgText .big { font-size: 30px; font-weight: 800; color: #d93025; }
  #dlgText .prod { font-weight: 700; }
  #dlgText .sub { color: #555; font-size: 14px; }
  #dlgText .tip { background: #fff6d6; border-left: 5px solid #f5c400; padding: 10px; border-radius: 6px; font-size: 15px; }
  .dlgbtns { display: flex; gap: 8px; }
  .dlgbtns > * { flex: 1; }
  .dlgbtns.stack { flex-direction: column; }
  .dlgbox .btn { padding: 16px; font-size: 17px; font-weight: 800; }

  #recent { list-style: none; margin: 0; padding: 0; }
  #recent li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 6px solid #6b7280; }
  #recent li.in { border-left-color: #1e9e48; }
  #recent li.out { border-left-color: #d93025; }
  #recent li.pending { opacity: .6; }
  #recent .chg { font-size: 20px; font-weight: 800; min-width: 52px; text-align: center; }
  #recent li.in .chg { color: #1e9e48; } #recent li.out .chg { color: #d93025; }
  #recent .info { flex: 1; min-width: 0; }
  #recent .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent .sub { font-size: 12px; color: #666; }
  #recent .qa { text-align: right; font-size: 13px; color: #444; white-space: nowrap; }
  #recent .qa b { font-size: 18px; color: #222; }
  .empty { color: #888; font-size: 14px; }

  /* Picking and inventory tables */
  .otable-wrap { overflow-x: auto; }
  .otable { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .otable th { background: #1a56c4; color: #fff; font-size: 13px; text-align: left; padding: 8px; }
  .otable.inv th { background: #7c3aed; }
  .otable td { padding: 8px; border-top: 1px solid #eee; font-size: 14px; vertical-align: top; }
  .otable td.raft { font-size: 20px; font-weight: 800; white-space: nowrap; }
  .otable td.num { text-align: right; font-weight: 700; white-space: nowrap; }
  .otable tr.warn td { background: #fce8e6; }
  .otable tr.done td { background: #e6f4ea; color: #4a6b52; }
  .otable tr.cur td { background: #fff6d6; }
  .otable tr.other td { background: #f1f1f1; color: #777; }
  .otable .ean { font-size: 12px; color: #666; }
  .otable .br { font-size: 12px; color: #1a56c4; font-weight: 600; }
  .otable .plus { color: #1e9e48; } .otable .minus { color: #d93025; }
  .osum { margin: 8px 0; font-weight: 600; color: #444; }
  #pickTarget { border: 4px solid #1a56c4; transition: background .2s; }
  #pickTarget .raft { font-size: 44px; font-weight: 900; color: #1a56c4; line-height: 1; }
  #pickTarget .what { font-size: 18px; font-weight: 700; margin-top: 6px; }
  #pickTarget .need { font-size: 22px; font-weight: 800; margin-top: 6px; }
  #pickTarget.good { background: #c8f0d4; }
  #pickTarget.bad { background: #ffc9c4; }
  #pickTarget.complete { border-color: #1e9e48; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Mini WMS</h1><span id="sync" class="saving">Loading stock…</span></div>
  <div id="verBanner" hidden></div>
  <div class="who"><span>Logged in as <b id="whoName">-</b></span>
    <span><button class="linkbtn sound" onclick="testSound()">🔊 Test sound</button>
    <button class="linkbtn" onclick="logout()">Logout</button></span></div>

  <div class="modes">
    <button data-mode="add" class="active" onclick="setMode('add')">+1</button>
    <button data-mode="remove" onclick="setMode('remove')">−1</button>
    <button data-mode="manual" onclick="setMode('manual')">MANUAL</button>
    <button data-mode="pick" class="wide" onclick="setMode('pick')">PICKING MODE</button>
    <button data-mode="inv" class="wide" onclick="setMode('inv')">MOD INVENTAR</button>
  </div>

  <!-- +1 / -1 / MANUAL -->
  <div id="stockPanel">
    <label for="shelf">Raft (shelf)</label>
    <select id="shelf"><option value="">— select raft —</option></select>

    <div id="manualBox" hidden>
      <label for="manualQty">Quantity to apply per scan (use a minus sign to remove, e.g. -5)</label>
      <input id="manualQty" type="number" step="1" inputmode="numeric">
      <div class="hint">Type the quantity, then scan. It is cleared after each successful scan.</div>
    </div>

    <label for="ean">Scan EAN</label>
    <div class="row">
      <input id="ean" inputmode="numeric" autocomplete="off" autofocus>
      <button class="btn sec cam" onclick="toggleCamera()">📷</button>
    </div>
    <div class="camslot"></div>
    <button class="undo" id="undoStock" onclick="undoStock()">UNDO LAST SCAN</button>
  </div>

  <!-- PICKING MODE -->
  <div id="pickPanel" hidden>
    <div id="pickTarget" class="card" hidden>
      <div class="raft" id="ptRaft"></div>
      <div class="what" id="ptWhat"></div>
      <div class="need" id="ptNeed"></div>
    </div>
    <label for="pickEan" id="pickLabel">Scan the products from the packing list</label>
    <div class="row">
      <input id="pickEan" inputmode="numeric" autocomplete="off">
      <button class="btn sec cam" onclick="toggleCamera()">📷</button>
    </div>
    <div class="camslot"></div>
    <button class="undo" id="undoPick" onclick="undoPick()">UNDO LAST SCAN</button>
  </div>

  <!-- MOD INVENTAR -->
  <div id="invPanel" hidden>
    <label for="invShelf">Raft to count</label>
    <select id="invShelf"><option value="">— select raft —</option></select>
    <label for="invQty">Quantity for the next scan (empty = 1 piece)</label>
    <input id="invQty" type="number" min="1" step="1" inputmode="numeric">
    <label for="invEan">Scan every product on this raft</label>
    <div class="row">
      <input id="invEan" inputmode="numeric" autocomplete="off">
      <button class="btn sec cam" onclick="toggleCamera()">📷</button>
    </div>
    <div class="camslot"></div>
    <button class="undo" id="undoInv" onclick="undoInv()">UNDO LAST SCAN</button>
  </div>

  <!-- camera + SCAN trigger; moved under the scan field of the active mode -->
  <div id="camBlock">
    <div id="reader" hidden>
      <video id="camVideo" playsinline muted autoplay></video>
      <div class="camtools">
        <button id="zoomBtn" type="button" hidden onclick="nextZoom()">1×</button>
        <button id="torchBtn" type="button" hidden onclick="toggleTorch()">🔦</button>
        <button id="switchBtn" type="button" hidden onclick="switchCamera()">🔄</button>
      </div>
    </div>
    <button id="scanBtn" class="scanbtn" type="button" onclick="scanPress()">SCAN</button>
  </div>

  <div id="msg" class="info">Select a raft, then scan.</div>

  <div id="newBox" class="card" hidden>
    <div class="name">New product · EAN <span id="newEan"></span></div>
    <label for="newName">Nume produs</label>
    <input id="newName">
    <label for="newBrand">Brand</label>
    <input id="newBrand">
    <label for="newLoc">Raft depozitare</label>
    <select id="newLoc"><option value="">— select raft —</option></select>
    <label for="newQty">Starting quantity</label>
    <input id="newQty" type="number" min="0" step="1" inputmode="numeric">
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="saveNew()">Save product</button>
      <button class="btn sec" onclick="cancelNew()">Cancel</button>
    </div>
  </div>

  <div id="stockArea">
    <div id="card" class="card" hidden>
      <div class="name" id="pName"></div>
      <div class="brand" id="pBrand"></div>
      <div class="meta">EAN <span id="pEan"></span> · Raft <b id="pLoc"></b></div>
      <div class="qty" id="pQty"></div>
    </div>
  </div>

  <div id="pickArea" hidden>
    <div class="osum" id="pickSum"></div>
    <div class="otable-wrap"><table class="otable">
      <thead><tr><th>Raft</th><th>Produs</th><th style="text-align:right" id="pickColQty">Buc</th><th style="text-align:right">Stoc</th></tr></thead>
      <tbody id="pickRows"></tbody>
    </table></div>
    <div class="row" style="margin-top:10px" id="pickListBtns">
      <button class="btn yes big" onclick="startPicking()">START PICKING</button>
      <button class="btn sec" id="clearPickBtn" onclick="clearPick()">Clear order</button>
    </div>
    <div style="margin-top:10px" id="pickPickBtns" hidden>
      <button class="btn yes big" style="width:100%" onclick="finishPick()">FINISH ORDER – remove from stock</button>
      <div class="row" style="margin-top:8px">
        <button class="btn sec" onclick="backToList()">Back to the list</button>
        <button class="btn sec" id="cancelPickBtn" onclick="clearPick()">Cancel order</button>
      </div>
    </div>
  </div>

  <div id="invArea" hidden>
    <div class="osum" id="invSum"></div>
    <div class="otable-wrap"><table class="otable inv">
      <thead id="invHead"></thead>
      <tbody id="invRows"></tbody>
    </table></div>
    <div class="row" style="margin-top:10px" id="invCountBtns">
      <button class="btn yes big" onclick="finishInv()">FINISH COUNT</button>
      <button class="btn sec" id="clearInvBtn" onclick="clearInv()">Clear count</button>
    </div>
    <div class="row" style="margin-top:10px" id="invReviewBtns" hidden>
      <button class="btn yes big" id="applyInvBtn" onclick="applyInv()">APPLY CORRECTIONS</button>
      <button class="btn sec" onclick="backToCount()">Back to counting</button>
    </div>
  </div>

  <h2>Last 5 stock changes</h2>
  <ul id="recent"><li class="empty">Loading…</li></ul>
</div>

<!-- employee login -->
<div id="login" class="overlay" hidden>
  <div class="dlgbox">
    <h3>Mini WMS</h3>
    <label for="loginCode">Your personal code</label>
    <input id="loginCode" type="password" inputmode="numeric" autocomplete="off">
    <div id="loginMsg"></div>
    <button class="btn yes" id="loginBtn" style="width:100%" onclick="doLogin()">LOG IN</button>
  </div>
</div>

<!-- questions -->
<div id="dlg" class="overlay" hidden>
  <div id="dlgBox" class="dlgbox" tabindex="-1">
    <div id="dlgText"></div>
    <div id="dlgBtns" class="dlgbtns"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  // Version of this page. The server (Code.gs) has its own WMS_VERSION; when they differ,
  // a red banner tells which side needs updating.
  const PAGE_VERSION = 20;

  // ---------- connection to the Google Apps Script API ----------
  // Web app URL of the API project (ends with /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbxPKIbG2i6kMiKKyesQB9onB0_GBSy6O8pM9bRBgm94qbJs-gVWw9xgoP0vECSStmc/exec';

  let session = {};
  try { session = JSON.parse(localStorage.getItem('wmsSession') || '{}'); } catch (e) {}

  // Some iPhones lose the data of a POST on Google's redirect, and the API only sees a page visit
  // (it answers "Mini WMS API is running."). Nothing was done in that case, so the same request
  // is sent again as GET with the data in the address; the phone then keeps using GET.
  let useGet = false;
  try { useGet = localStorage.getItem('wmsUseGet') === '1'; } catch (e) {}

  // Errors from the connection or Google's own error pages: the request can be tried again later.
  function transportError(text) {
    const err = new Error(text);
    err.transport = true;
    return err;
  }

  async function sendRequest(body, asGet) {
    try {
      if (asGet) {
        return await fetch(API_URL + '?q=' + encodeURIComponent(JSON.stringify(body)), { cache: 'no-store' });
      }
      // text/plain keeps this a "simple" request, which Google accepts from another website.
      return await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        cache: 'no-store'
      });
    } catch (e) {
      throw transportError('No connection to Google (' + e.message + ').');
    }
  }

  async function post(body) {
    let res = await sendRequest(body, useGet);
    let text = await res.text();
    if (!useGet && text.indexOf('Mini WMS API is running') >= 0) {
      useGet = true;
      try { localStorage.setItem('wmsUseGet', '1'); } catch (e) {}
      res = await sendRequest(body, true);
      text = await res.text();
    }
    try {
      return JSON.parse(text);
    } catch (e) {
      const title = (text.match(/<title>([^<]*)<\/title>/i) || [])[1];
      const body1 = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>|<[^>]+>/g, ' ')
                        .replace(/\s+/g, ' ').trim().slice(0, 160);
      throw transportError('Google sent a page instead of data (HTTP ' + res.status + '): ' +
                           ([(title || '').trim(), body1].filter(Boolean).join(' – ') || 'empty answer'));
    }
  }

  async function apiCall(action, args) {
    const body = { action: action, args: args, token: session.token };
    let data;
    try {
      data = await post(body);
    } catch (e) {
      // Loading the stock changes nothing, so it is safe to try once more after a short pause.
      if (action !== 'getInit') throw e;
      await new Promise(r => setTimeout(r, 1500));
      data = await post(body);
    }
    if (!data.ok) {
      if (data.auth) showLogin(data.error);
      const err = new Error(data.error || 'Unknown error');
      err.auth = !!data.auth;
      // Google busy with other scans: nothing was written yet, so it is safe to try again.
      err.transport = /lock/i.test(data.error || '');
      throw err;
    }
    if (data.user && data.user !== session.user) { // name corrected in the employee list
      session.user = data.user;
      $('whoName').textContent = data.user;
    }
    return data;
  }

  // Same calling style as google.script.run inside Apps Script.
  function runner(onOk, onFail) {
    return new Proxy({}, {
      get(_, name) {
        if (name === 'withSuccessHandler') return h => runner(h, onFail);
        if (name === 'withFailureHandler') return h => runner(onOk, h);
        return (...args) => {
          apiCall(name, args)
            .then(data => { if (onOk) onOk(data.result); })
            .catch(err => { if (onFail) onFail(err); });
        };
      }
    });
  }
  window.google = { script: { get run() { return runner(null, null); } } };

  function showLogin(text) {
    session = {};
    try { localStorage.removeItem('wmsSession'); } catch (e) {}
    $('login').hidden = false;
    $('loginMsg').textContent = text || '';
    $('loginCode').value = '';
    $('loginCode').focus();
  }

  async function doLogin() {
    const code = $('loginCode').value.trim();
    if (!code) { $('loginMsg').textContent = 'Type your code.'; return; }
    $('loginBtn').disabled = true;
    $('loginMsg').textContent = 'Checking…';
    try {
      const res = await post({ action: 'login', code: code });
      if (!res.ok) { $('loginMsg').textContent = res.error; return; }
      session = { token: res.token, user: res.user };
      try { localStorage.setItem('wmsSession', JSON.stringify(session)); } catch (e) {}
      $('login').hidden = true;
      startApp();
    } catch (e) {
      $('loginMsg').textContent = 'Connection problem: ' + e.message;
    } finally {
      $('loginBtn').disabled = false;
    }
  }

  function logout() {
    if (pending.length || inFlight.length) { show('err', 'Wait until all scans are saved, then log out.'); return; }
    const token = session.token;
    if (token) fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ action: 'logout', token: token }) }).catch(() => {});
    stopCamera();
    stopApp();
    showLogin('Logged out.');
  }

  // Battery: the stock list is reloaded every 2 minutes, and only while the page is on screen.
  const REFRESH_MS = 120000;
  let refreshTimer = null;
  let lastLoad = 0;

  function startApp() {
    $('whoName').textContent = session.user || '-';
    loadStock();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (document.hidden) return;
      if (!pending.length && !inFlight.length && $('newBox').hidden && $('dlg').hidden && $('login').hidden) loadStock();
    }, REFRESH_MS);
    flush(); // scans kept on the phone from before (offline or page closed) are sent now
    focusScan();
  }

  function stopApp() {
    clearInterval(refreshTimer);
    stock = {};
    recent = [];
    undoStack = [];
    renderRecent();
    updateUndoButtons();
    $('card').hidden = true;
    $('whoName').textContent = '-';
  }

  // ---------- state ----------
  // The whole stock list is kept in the page, so a scan shows its result instantly.
  // Changes are saved to the sheet in the background, several at once, in order;
  // the sheet stays the source of truth and corrects the screen if needed.
  let mode = 'add';
  let stock = {};          // normalized EAN -> {ean, name, brand, location, qty}
  let recent = [];         // last changes shown at the bottom
  const pending = [];      // changes waiting to be sent
  let inFlight = [];       // changes being sent now
  let inFlightReqId = null;
  let seq = 0;
  let cardKey = null;      // EAN shown in the product card
  let serverVersion = null;
  const norm = e => String(e).trim().replace(/^0+/, '');
  const sameShelf = (a, b) => String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
  const byShelf = (a, b) => (a || '~').localeCompare(b || '~', undefined, { numeric: true });
  const clock = () => new Date().toTimeString().slice(0, 8);
  const UNDO_MAX = 10;

  let undoStack = [];      // stock scans that can be undone: {id, ean, d, locSet, prevLoc}

  // Auto-apply: a scanner that ends with Enter applies at once; without Enter,
  // the code is applied after a short pause once it looks like a full barcode.
  const AUTO_DELAY_MS = 400;
  const MIN_EAN_LEN = 8;
  let autoTimer = null;

  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function keep(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // Changes not yet confirmed by the server are kept on the phone, so they survive a dropped
  // connection, a closed page or a phone restart, and are sent as soon as possible.
  function saveQueue() {
    keep('wmsQueue', { seq: seq, pending: pending, inFlight: inFlight, reqId: inFlightReqId });
  }
  function restoreQueue() {
    const q = load('wmsQueue', null);
    if (!q) return;
    seq = Math.max(seq, q.seq || 0);
    (q.pending || []).forEach(j => pending.push(j));
    inFlight = q.inFlight || [];
    inFlightReqId = inFlight.length ? (q.reqId || newReqId()) : null;
  }

  // ---------- screen helpers ----------

  const MODE_PANEL = { add: 'stockPanel', remove: 'stockPanel', manual: 'stockPanel', pick: 'pickPanel', inv: 'invPanel' };

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    const stockMode = MODE_PANEL[m] === 'stockPanel';
    $('stockPanel').hidden = !stockMode;
    $('stockArea').hidden = !stockMode;
    $('pickPanel').hidden = m !== 'pick';
    $('pickArea').hidden = m !== 'pick';
    $('invPanel').hidden = m !== 'inv';
    $('invArea').hidden = m !== 'inv';
    $('manualBox').hidden = m !== 'manual';
    $('ean').value = '';
    $('manualQty').value = '';
    placeCamera();
    const labels = {
      add: '+1 per scan', remove: '−1 per scan',
      manual: 'type the quantity, then scan EAN',
      pick: pick.phase === 'pick' ? 'PICKING: go raft by raft and scan each product you take'
                                  : 'PICKING MODE: scan the packing list, then press START PICKING',
      inv: 'MOD INVENTAR: choose the raft, scan everything on it, then press FINISH COUNT'
    };
    show('info', 'Mode: ' + labels[m]);
    renderPick();
    renderInv();
    focusScan();
  }

  // The camera strip and SCAN button sit directly under the scan field of the active mode.
  function placeCamera() {
    const slot = document.querySelector('#' + MODE_PANEL[mode] + ' .camslot');
    if (slot && $('camBlock').parentNode !== slot) slot.appendChild($('camBlock'));
  }

  function focusScan() {
    if (mode === 'pick') { $('pickEan').focus(); return; }
    if (mode === 'inv') { (inv.shelf ? $('invEan') : $('invShelf')).focus(); return; }
    if (!$('shelf').value) $('shelf').focus();
    else if (mode === 'manual' && manualQty() === null) $('manualQty').focus();
    else $('ean').focus();
  }

  function show(type, text) {
    $('msg').className = type;
    $('msg').textContent = text;
    if (type === 'err') alarm();
    if (type === 'ok') okSound();
  }

  function alarm() {
    beep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  // One shared audio player. Phones only allow sound after the user has touched the page,
  // so it is switched on at every tap or key press. To save battery it is paused when no
  // sound was played for 20 seconds.
  // iPhone (iOS 16.4+): play the beeps like media, so they are heard even when the phone is on silent.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  let audioCtx = null;
  let audioIdle = null;
  function audio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // 'suspended', or 'interrupted' on iPhone after a call, the lock screen or another app
      if (audioCtx.state !== 'running') audioCtx.resume();
    } catch (e) {}
    return audioCtx;
  }
  ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown']
    .forEach(ev => document.addEventListener(ev, audio, { passive: true }));

  function tone(freq, ms, type, volume) {
    const ctx = audio();
    if (!ctx) return;
    const play = () => {
      try {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type;
        o.frequency.value = freq;
        // Full volume for most of the tone, then a short fade (avoids a click at the end).
        const t = ctx.currentTime, end = t + ms / 1000;
        g.gain.setValueAtTime(volume, t);
        g.gain.setValueAtTime(volume, end - 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, end);
        o.connect(g); g.connect(ctx.destination);
        o.start(t);
        o.stop(end);
      } catch (e) {}
    };
    if (ctx.state === 'running') play(); else ctx.resume().then(play).catch(() => {});
    clearTimeout(audioIdle);
    audioIdle = setTimeout(() => { try { if (audioCtx && audioCtx.state === 'running') audioCtx.suspend(); } catch (e) {} }, 20000);
  }

  // Error: low buzz. Success: loud high "scanner" beep (around 2.7 kHz, where the ear and
  // phone speakers are most sensitive; a square wave sounds much louder than a soft sine).
  function beep() { tone(220, 350, 'square', 0.25); }
  function okSound() { tone(2700, 150, 'square', 0.6); }

  // 🔊 button: plays the success beep so each person can check the phone's volume settings.
  async function testSound() {
    const ctx = audio();
    if (!ctx) { show('err', 'This browser cannot play sounds.'); return; }
    try { if (ctx.state !== 'running') await ctx.resume(); } catch (e) {}
    okSound();
    show('info', 'Test beep played (sound: ' + ctx.state + '). Heard nothing? Turn up the MEDIA volume, ' +
                 'switch off silent mode / Do Not Disturb, and check that no Bluetooth headphones are connected.');
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // "Nume produs · Brand · EAN 590…" for messages
  function label(p) {
    return [p.name || '(no name)', p.brand, 'EAN ' + p.ean].filter(Boolean).join(' · ');
  }

  function fillShelves(list) {
    ['shelf', 'newLoc', 'invShelf'].forEach(id => {
      const sel = $(id), keepValue = sel.value || (id === 'invShelf' ? inv.shelf : '');
      sel.innerHTML = '<option value="">— select raft —</option>' +
        list.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
      if (keepValue) setSelect(sel, keepValue);
    });
    markShelf();
  }

  // Selects a shelf, adding it to the list if the sheet uses one that is not in the dropdown.
  function setSelect(sel, value) {
    if (![].some.call(sel.options, o => o.value === value)) {
      const o = document.createElement('option');
      o.value = value; o.textContent = value;
      sel.appendChild(o);
    }
    sel.value = value;
  }

  function markShelf() {
    $('shelf').classList.toggle('missing', !$('shelf').value);
    $('invShelf').classList.toggle('missing', !$('invShelf').value);
  }

  function showProduct(p) {
    cardKey = norm(p.ean);
    $('card').hidden = false;
    $('pName').textContent = p.name || '(no name)';
    $('pBrand').textContent = p.brand || '';
    $('pEan').textContent = p.ean;
    $('pLoc').textContent = p.location || '-';
    $('pQty').textContent = p.qty;
  }

  function addRecent(entry) {
    recent.unshift(entry);
    recent = recent.slice(0, 5);
    renderRecent();
  }

  function setRecentState(id, saved) {
    const i = recent.findIndex(r => r.id === id);
    if (i < 0) return;
    if (saved) recent[i].pending = false; else recent.splice(i, 1);
    renderRecent();
  }

  let syncNote = '';
  function setSync() {
    const n = pending.length + inFlight.length;
    $('sync').className = n ? (syncNote ? 'err' : 'saving') : '';
    $('sync').textContent = n ? (syncNote || 'Saving ' + n + '…') : '✓ Saved';
  }

  function renderRecent() {
    if (!recent.length) { $('recent').innerHTML = '<li class="empty">No stock changes yet.</li>'; return; }
    $('recent').innerHTML = recent.map(r => {
      // change is null for a paste in the sheet, where the old quantity is unknown
      const cls = (r.change == null || r.change === 0 ? '' : r.change > 0 ? 'in' : 'out') + (r.pending ? ' pending' : '');
      const chg = r.change == null ? '✎' : r.type === 'MOVE' ? '⇄' : (r.change > 0 ? '+' : '') + r.change;
      return '<li class="' + cls + '">' +
        '<div class="chg">' + esc(chg) + '</div>' +
        '<div class="info"><div class="nm">' + esc(r.name || r.ean) + (r.brand ? ' · ' + esc(r.brand) : '') + '</div>' +
        '<div class="sub">' + esc(r.time) + ' · ' + esc(r.type) + ' · EAN ' + esc(r.ean) +
        (r.location ? ' · Raft ' + esc(r.location) : '') + '</div></div>' +
        '<div class="qa">' + esc(r.before) + ' → <b>' + esc(r.after) + '</b></div></li>';
    }).join('');
  }

  function recentEntry(id, p, type, change, before, after, isPending) {
    return { id: id, time: clock(), ean: p.ean, name: p.name, brand: p.brand, location: p.location,
             type: type, change: change, before: before, after: after, pending: isPending };
  }

  function updateUndoButtons() {
    [['undoStock', undoStack.length], ['undoPick', pick.undo.length], ['undoInv', inv.undo.length]].forEach(([id, n]) => {
      $(id).textContent = 'UNDO LAST SCAN' + (n ? ' (' + n + ')' : '');
      $(id).disabled = !n;
    });
  }

  function pushUndo(entry) {
    undoStack.push(entry);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    updateUndoButtons();
  }

  function dropUndo(id) {
    undoStack = undoStack.filter(u => u.id !== id);
    updateUndoButtons();
  }

  function twoTap(btnId, normalText, action) {
    const b = $(btnId);
    if (!b.dataset.armed) {
      b.dataset.armed = '1';
      b.textContent = 'Tap again to confirm';
      setTimeout(() => { delete b.dataset.armed; b.textContent = normalText; }, 3000);
      return;
    }
    delete b.dataset.armed;
    b.textContent = normalText;
    action();
  }

  // ---------- questions ----------

  // buttons: [{ label, cls, fn }]
  function ask(kind, html, buttons) {
    clearTimeout(autoTimer);
    $('dlgBox').className = 'dlgbox ' + kind;
    $('dlgText').innerHTML = html;
    const box = $('dlgBtns');
    box.innerHTML = '';
    box.classList.toggle('stack', buttons.length > 2);
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn ' + (b.cls || '');
      el.textContent = b.label;
      el.addEventListener('click', () => { $('dlg').hidden = true; if (b.fn) b.fn(); });
      box.appendChild(el);
    });
    $('dlg').hidden = false;
    $('dlgBox').focus(); // keeps scanner input away from the fields while the question is open
    alarm();
  }

  // A question or the new-product form is open: scans are not accepted until it is answered.
  function blocked() {
    if (!$('dlg').hidden) { $('dlgBox').focus(); return true; }
    if (!$('newBox').hidden) { show('err', 'Finish or cancel the new product first.'); return true; }
    return false;
  }

  // New features need the new server code; a clear message instead of a confusing error.
  function serverReady() {
    if (serverVersion != null && serverVersion >= PAGE_VERSION) return true;
    show('err', 'The server is outdated for this feature: deploy the latest Code.gs and Api.gs (New version) first.');
    return false;
  }

  function askAddProduct(ean, qty, loc) {
    ask('ask',
      'EAN <span class="prod">' + esc(ean) + '</span> is <b>not in the stock list</b>.<br><br>' +
      'Add it at the bottom of the list?',
      [{ label: 'YES, add it', cls: 'yes', fn: () => openNew(ean, qty, loc) },
       { label: 'NO', cls: 'sec', fn: () => { show('info', 'Not added. EAN ' + ean + ' was ignored.'); focusScan(); } }]);
  }

  function askWrongShelf(p, selected, d) {
    ask('warn',
      '<span class="prod">' + esc(p.name || '(no name)') + '</span>' +
      (p.brand ? ' · ' + esc(p.brand) : '') + '<div class="sub">EAN ' + esc(p.ean) + ' · stoc ' + p.qty + '</div><br>' +
      'Raft original: <span class="big">' + esc(p.location) + '</span> &nbsp; Raft selectat: <b>' + esc(selected) + '</b><br><br>' +
      '<div class="tip">Acest produs se află deja la alt raft. Poți alege să muți acest produs la raftul original și îți voi ' +
      'seta, mai sus, raftul original, iar tu <b>RESCANEZI</b> acum <b>SAU</b> poți alege să aduci în noul raft toată ' +
      'cantitatea din acest produs.</div>',
      [{ label: 'Setează raftul original ' + p.location + ' – apoi RESCANEZ', cls: 'yes', fn: () => {
           setSelect($('shelf'), p.location.trim());
           markShelf();
           show('info', 'Raftul ' + p.location + ' a fost setat mai sus. RESCANEAZĂ produsul acum.');
           $('ean').focus();
         } },
       { label: 'Adu toată cantitatea în raftul ' + selected, cls: 'move', fn: () => moveProduct(p, selected, d) },
       { label: 'Anulează', cls: 'sec', fn: () => {
           show('err', 'Scan refused: ' + (p.name || p.ean) + ' belongs on raft ' + p.location + '.');
           focusScan();
         } }]);
  }

  // ---------- +1 / -1 / MANUAL ----------

  // Called when the EAN field holds a complete code (Enter, Tab, auto-delay or camera).
  function eanEntered() {
    clearTimeout(autoTimer);
    const ean = $('ean').value.trim();
    if (!ean) return;
    if (blocked()) { $('ean').value = ''; return; }
    $('ean').value = '';
    let d = mode === 'add' ? 1 : -1;
    if (mode === 'manual') {
      d = manualQty();
      if (d === null) {
        show('err', 'Type the quantity first (e.g. 5, or -5 to remove), then scan.');
        $('manualQty').focus();
        return;
      }
    }
    $('ean').focus();
    if (stockScan(ean, d)) afterManualScan();
  }

  // MANUAL: the quantity is used for one scan only.
  function afterManualScan() {
    if (mode !== 'manual') return;
    $('manualQty').value = '';
    $('manualQty').focus();
  }

  // MANUAL quantity: a non-zero whole number, or null when empty or not valid.
  function manualQty() {
    const raw = $('manualQty').value.trim();
    if (raw.replace('-', '').length >= MIN_EAN_LEN) return null; // a barcode, not a quantity
    const d = Number(raw);
    return raw && Number.isInteger(d) && d !== 0 ? d : null;
  }

  // Enter in the quantity field: check it, then go to the scan field.
  function manualApply() {
    const raw = $('manualQty').value.trim();
    if (raw.replace('-', '').length >= MIN_EAN_LEN) {
      // A barcode scanned into the quantity field by mistake.
      $('manualQty').value = '';
      show('err', 'That was a barcode, not a quantity. Type the quantity first, then scan.');
      $('manualQty').focus();
      return;
    }
    const d = manualQty();
    if (d === null) { show('err', 'Enter a non-zero whole number for the quantity.'); $('manualQty').focus(); return; }
    show('info', 'Quantity ' + (d > 0 ? '+' : '') + d + ' set. Scan EAN.');
    $('ean').focus();
  }

  // Returns true when the scan was accepted.
  function stockScan(ean, d) {
    if (blocked()) return false;
    const sel = $('shelf').value;
    if (!sel) { show('err', 'Select a raft first.'); markShelf(); $('shelf').focus(); return false; }

    const p = stock[norm(ean)];
    if (!p) {
      askAddProduct(ean, d > 0 ? d : 0, sel);
      return false;
    }
    if (p.location.trim() && !sameShelf(p.location, sel)) {
      showProduct(p);
      show('err', 'Wrong raft: ' + label(p) + ' is stored on raft ' + p.location + '.');
      send({ id: ++seq, ean: p.ean, d: d, loc: sel, applied: false }); // logged as REJECTED
      askWrongShelf(p, sel, d);
      return false;
    }
    if (p.qty + d < 0) {
      showProduct(p);
      show('err', label(p) + ': ' + (p.qty === 0 ? 'stock is already 0, nothing to remove.' : 'only ' + p.qty + ' in stock, cannot remove ' + (-d) + '.'));
      send({ id: ++seq, ean: p.ean, d: d, loc: sel, applied: false }); // logged as REJECTED
      return false;
    }
    applyStockScan(p, d, sel, '');
    return true;
  }

  function applyStockScan(p, d, sel, prefix) {
    const job = { id: ++seq, ean: p.ean, d: d, loc: sel, applied: true };
    const before = p.qty, after = before + d;
    const locSet = !p.location.trim();
    job.locSet = locSet;
    if (locSet) p.location = sel;
    p.qty = after;
    pushUndo({ id: job.id, ean: p.ean, d: d, locSet: locSet, prevLoc: '' });
    showProduct(p);
    show('ok', prefix + (d > 0 ? '+' : '') + d + ' → ' + label(p) + ' · now ' + after +
               (locSet ? ' · raft ' + sel + ' assigned' : ''));
    addRecent(recentEntry(job.id, p, d > 0 ? 'IN' : 'OUT', d, before, after, true));
    send(job);
  }

  // Wrong-shelf question, option 2: the whole quantity goes to the selected shelf, then the scan counts there.
  function moveProduct(p, toShelf, d) {
    if (!serverReady()) return;
    const from = p.location;
    const job = { id: ++seq, move: true, ean: p.ean, loc: toShelf, prevLoc: from, locSet: true, applied: true };
    p.location = toShelf;
    addRecent(recentEntry(job.id, p, 'MOVE', 0, from, toShelf, true));
    send(job);
    if (p.qty + d < 0) {
      showProduct(p);
      show('err', 'Moved to raft ' + toShelf + ', but only ' + p.qty + ' in stock: cannot remove ' + (-d) + '.');
      return;
    }
    applyStockScan(p, d, toShelf, 'Moved ' + from + ' → ' + toShelf + ' (whole quantity) · ');
    afterManualScan();
  }

  function undoStock() {
    if (blocked()) return;
    const u = undoStack.pop();
    updateUndoButtons();
    if (!u) { show('info', 'Nothing to undo.'); return; }
    const d = -u.d;
    const job = { id: ++seq, ean: u.ean, d: d, undo: true, applied: false };
    if (u.locSet) job.restoreLoc = u.prevLoc;
    const p = stock[norm(u.ean)];
    if (p) {
      const before = p.qty, after = before + d;
      if (after < 0) {
        show('err', 'Undo not possible: only ' + before + ' in stock now.');
        return;
      }
      p.qty = after;
      if (u.locSet) { p.location = u.prevLoc; job.locSet = true; }
      job.applied = true;
      showProduct(p);
      show('ok', 'UNDO: ' + (d > 0 ? '+' : '') + d + ' → ' + label(p) + ' · now ' + after +
                 (u.locSet ? ' · raft removed' : ''));
      addRecent(recentEntry(job.id, p, 'UNDO', d, before, after, true));
    }
    send(job);
    focusScan();
  }

  // ---------- saving to the sheet ----------

  function send(job) {
    pending.push(job);
    saveQueue();
    setSync();
    flush();
  }

  // Quantity change of the changes shown on screen but not yet confirmed by the server.
  function unconfirmed(key) {
    return pending.concat(inFlight)
      .filter(j => j.applied && typeof j.d === 'number' && norm(j.ean) === key)
      .reduce((s, j) => s + j.d, 0);
  }

  // Shelf the product will have once the unconfirmed changes are saved (null = no change).
  function unconfirmedLoc(key) {
    let loc = null;
    pending.concat(inFlight).forEach(j => {
      if (!j.applied || !j.locSet || norm(j.ean) !== key) return;
      loc = j.undo ? (j.restoreLoc || '') : j.loc;
    });
    return loc;
  }

  // Waits between attempts when there is no connection or Google sends an error page;
  // after the last one it keeps trying every 15 seconds until it works.
  const RETRY_DELAYS_MS = [1000, 3000, 6000, 10000];
  let sending = false, sendTimer = null;
  function newReqId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12); }

  function flush() {
    if (sending || sendTimer || !session.token) return;
    if (!inFlight.length) {
      if (!pending.length) return;
      inFlight = pending.splice(0, pending.length);
      inFlightReqId = newReqId();
      saveQueue();
    }
    sendBatch(0);
  }

  // Sends the batch in inFlight. A failed batch is sent again with the SAME request id: if Google had
  // already applied it and only the answer was lost, the server returns that answer and applies nothing twice.
  function sendBatch(attempt) {
    sending = true;
    const batch = inFlight;
    google.script.run
      .withSuccessHandler(results => {
        sending = false;
        syncNote = '';
        inFlight = [];
        inFlightReqId = null;
        saveQueue();
        results.forEach((r, k) => handleResult(batch[k], r));
        setSync();
        flush();
      })
      .withFailureHandler(e => {
        sending = false;
        if (e.auth) { syncNote = 'Log in again: ' + (pending.length + inFlight.length) + ' changes waiting'; setSync(); return; }
        if (e.transport) {
          const n = pending.length + inFlight.length;
          syncNote = 'No connection: ' + n + ' change' + (n > 1 ? 's' : '') + ' kept on this phone, retrying…';
          setSync();
          sendTimer = setTimeout(() => { sendTimer = null; sendBatch(attempt + 1); }, RETRY_DELAYS_MS[attempt] || 15000);
          return;
        }
        // The server refused the whole batch (should not happen): drop it so the queue does not get stuck.
        syncNote = '';
        inFlight = [];
        inFlightReqId = null;
        saveQueue();
        batch.forEach(j => { setRecentState(j.id, false); dropUndo(j.id); });
        show('err', 'NOT SAVED (' + batch.length + ' changes): ' + e.message);
        loadStock(); // put the screen back in line with the sheet
        flush();
      })
      .applyChanges(batch.map(serverJob), inFlightReqId);
  }

  function serverJob(j) {
    if (j.add) return { id: j.id, add: true, ean: j.ean, name: j.name, brand: j.brand, loc: j.loc, qty: j.qty };
    if (j.move) return { id: j.id, move: true, ean: j.ean, loc: j.loc };
    if (j.count) return { id: j.id, count: true, ean: j.ean, qty: j.qty, loc: j.loc };
    const o = { id: j.id, ean: j.ean, d: j.d };
    if (j.undo) { o.undo = true; if (j.restoreLoc != null) o.restoreLoc = j.restoreLoc; }
    else if (j.pick) { o.pick = true; o.orderId = j.orderId; }
    else o.loc = j.loc;
    return o;
  }

  // Back online, or back on screen: send what is waiting right away.
  function retryNow() {
    if (sendTimer) { clearTimeout(sendTimer); sendTimer = null; sendBatch(0); }
    else flush();
  }
  window.addEventListener('online', retryNow);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    audio();
    if (pending.length || inFlight.length) retryNow();
    if (session.token && Date.now() - lastLoad > REFRESH_MS) loadStock();
  });

  function handleResult(job, r) {
    if (job.add) { handleAddResult(job, r); return; }
    if (r.product) {
      const key = norm(r.product.ean);
      r.product.qty += unconfirmed(key); // keep later changes that are still on their way
      const loc = unconfirmedLoc(key);
      if (loc !== null) r.product.location = loc;
      stock[key] = r.product;
      if (cardKey === key) showProduct(r.product);
    }
    if (job.move) {
      if (r.ok) setRecentState(job.id, true);
      else { setRecentState(job.id, false); show('err', 'Move NOT saved: ' + r.error); loadStock(); }
      return;
    }
    if (r.ok) {
      if (job.applied) {
        setRecentState(job.id, true);
      } else {
        // The page had an outdated quantity or shelf; the sheet accepted the scan.
        if (!job.undo) pushUndo({ id: job.id, ean: r.product.ean, d: job.d, locSet: r.locChanged, prevLoc: r.prevLoc || '' });
        show('ok', (job.undo ? 'UNDO: ' : '') + (job.d > 0 ? '+' : '') + job.d + ' → ' + label(r.product) + ' · now ' + r.after);
        addRecent(recentEntry(job.id, r.product, job.undo ? 'UNDO' : (job.d > 0 ? 'IN' : 'OUT'), job.d, r.before, r.after, false));
      }
    } else if (job.applied) {
      // Shown as done, but the sheet refused it (for example someone else took the last piece).
      setRecentState(job.id, false);
      dropUndo(job.id);
      const what = job.pick ? 'Picking NOT removed from stock: ' : job.count ? 'Inventory correction NOT saved: ' : '';
      show('err', what + (r.product ? label(r.product) + ' – ' : '') + r.error);
      if (r.notFound) loadStock();
    }
  }

  function loadStock() {
    lastLoad = Date.now();
    google.script.run
      .withSuccessHandler(res => {
        stock = res.stock;
        // keep new products and changes made while loading or kept from before
        pending.concat(inFlight).filter(j => j.add).forEach(j => {
          if (!stock[norm(j.ean)]) stock[norm(j.ean)] = newProduct(j);
        });
        pending.concat(inFlight).filter(j => j.applied && !j.add).forEach(j => {
          const p = stock[norm(j.ean)];
          if (!p) return;
          if (typeof j.d === 'number') p.qty += j.d;
          if (j.locSet) p.location = j.undo ? (j.restoreLoc || '') : j.loc;
        });
        fillShelves(res.shelves || []);
        checkVersion(res.version);
        if (!pending.length && !inFlight.length) recent = res.recent;
        renderRecent();
        renderPick();
        renderInv();
        setSync();
      })
      .withFailureHandler(e => {
        if (e.auth) return;
        $('sync').className = 'err';
        $('sync').textContent = 'Could not load stock';
        show('err', 'Could not load stock: ' + e.message);
      })
      .getInit();
  }

  function checkVersion(v) {
    serverVersion = v == null ? null : Number(v);
    const b = $('verBanner');
    if (serverVersion == null || serverVersion < PAGE_VERSION) {
      b.textContent = '⚠ The server is outdated (server v' + (serverVersion == null ? '?' : serverVersion) + ', page v' + PAGE_VERSION +
                      '). In Apps Script paste the latest Code.gs and Api.gs, then Deploy → Manage deployments → ✏️ → New version.';
      b.hidden = false;
    } else if (serverVersion > PAGE_VERSION) {
      b.textContent = '⚠ This page is older than the server (page v' + PAGE_VERSION + ', server v' + serverVersion +
                      '). Reload the page; if this stays, upload the latest index.html to GitHub.';
      b.hidden = false;
    } else {
      b.hidden = true;
    }
  }

  // ---------- new product ----------

  function openNew(ean, qty, loc) {
    $('newEan').textContent = ean;
    $('newQty').value = qty;
    $('newName').value = '';
    $('newBrand').value = '';
    $('newLoc').value = '';
    if (loc) setSelect($('newLoc'), loc);
    $('newBox').hidden = false;
    show('info', 'Fill in the new product, then Save.');
    $('newName').focus();
  }

  function closeNew() {
    $('newBox').hidden = true;
    focusScan();
  }

  function cancelNew() {
    show('info', 'Cancelled. The product was not added.');
    closeNew();
  }

  function saveNew() {
    const ean = $('newEan').textContent;
    const name = $('newName').value.trim();
    const qty = $('newQty').value === '' ? 0 : Number($('newQty').value);
    if (!name) { show('err', 'Type the product name.'); $('newName').focus(); return; }
    if (!$('newLoc').value) { show('err', 'Select the raft for the new product.'); $('newLoc').focus(); return; }
    if (!(qty >= 0) || Math.floor(qty) !== qty) { show('err', 'Starting quantity must be 0 or more.'); $('newQty').focus(); return; }

    // Shown at once; saved in the background in the same queue as the scans, so the
    // product can be scanned right away and its scans reach the sheet after it.
    const job = { id: ++seq, add: true, applied: true, ean: ean13(ean), name: name,
                  brand: $('newBrand').value.trim(), loc: $('newLoc').value, qty: qty };
    const p = newProduct(job);
    stock[norm(p.ean)] = p;
    addRecent(recentEntry(job.id, p, 'NEW', qty, 0, qty, true));
    showProduct(p);
    show('ok', 'Added at the bottom of the list: ' + label(p) + ' · qty ' + qty + ' · raft ' + p.location);
    if (mode === 'manual') $('manualQty').value = ''; // next product needs its own quantity
    closeNew();
    renderPick();
    renderInv();
    send(job);
  }

  // EANs are stored as 13 characters; a 12-digit UPC-A code gets its leading 0 back (same as the server).
  function ean13(ean) {
    ean = String(ean).trim();
    return /^\d{12}$/.test(ean) ? '0' + ean : ean;
  }

  function newProduct(job) {
    return { ean: job.ean, name: job.name, brand: job.brand, location: job.loc, qty: job.qty };
  }

  function handleAddResult(job, r) {
    const key = norm(job.ean);
    if (r.ok) {
      setRecentState(job.id, true);
      return;
    }
    setRecentState(job.id, false);
    if (r.exists && r.product) {
      // Someone added the same EAN meanwhile: the sheet's row stays, the starting quantity was not added.
      r.product.qty += unconfirmed(key);
      stock[key] = r.product;
      if (cardKey === key) showProduct(r.product);
      show('err', 'EAN ' + job.ean + ' was already in the list (added by someone else). ' +
                  'Starting quantity NOT added. Check the product and scan again if needed.');
    } else {
      show('err', 'New product NOT saved: ' + (r.error || 'unknown error') + '. Please add it again.');
      loadStock();
    }
    renderPick();
    renderInv();
  }

  // ---------- PICKING MODE ----------
  // 1. Scan the packing list (each scan = one piece needed).
  // 2. START PICKING: the app shows the next raft and product; scan each piece you take
  //    (right product: ✓ green, wrong or too many: ✗ red alarm).
  // 3. FINISH ORDER: the picked pieces are removed from stock (one PICK change per product) and
  //    the order is saved in the Comenzi tab.

  function emptyPick() { return { phase: 'list', lines: {}, undo: [], orderId: '' }; }
  let pick = emptyPick();

  function storePick() { keep('wmsPick', pick); }
  function restorePick() {
    pick = load('wmsPick', null);
    if (!pick) {
      pick = emptyPick();
      // the list of the previous version (COMANDA NOUA) is kept
      const old = load('wmsOrder', null);
      if (old && old.order) {
        Object.keys(old.order).forEach(k => { pick.lines[k] = { ean: old.order[k].ean, need: old.order[k].count, picked: 0 }; });
      }
    }
    pick.undo = pick.undo || [];
  }

  function pickEntered() {
    clearTimeout(autoTimer);
    const ean = $('pickEan').value.trim();
    $('pickEan').value = '';
    if (!ean || blocked()) return;
    $('pickEan').focus();
    pickScan(ean);
  }

  function pickScan(ean) {
    const key = norm(ean);
    const p = stock[key];
    if (pick.phase === 'list') {
      const line = pick.lines[key] || { ean: p ? p.ean : ean, need: 0, picked: 0 };
      line.need++;
      pick.lines[key] = line;
      pushPickUndo({ key: key, kind: 'list' });
      if (!p) {
        show('err', 'EAN ' + ean + ' is not in the stock list (kept in the order).');
        askAddProduct(ean, 0, '');
      } else if (p.qty < line.need) {
        show('err', 'Raft ' + (p.location || '-') + ' · ' + label(p) + ' · only ' + p.qty + ' in stock, order needs ' + line.need);
      } else {
        show('ok', 'Raft ' + (p.location || '-') + ' · ' + label(p) + ' · x' + line.need);
      }
    } else {
      const line = pick.lines[key];
      const name = p ? label(p) : 'EAN ' + ean;
      if (!line) {
        show('err', '✗ WRONG PRODUCT – not in this order: ' + name);
        flashPick(false);
      } else if (line.picked >= line.need) {
        show('err', '✗ TOO MANY – you already took all ' + line.need + ' of ' + name);
        flashPick(false);
      } else {
        line.picked++;
        pushPickUndo({ key: key, kind: 'pick' });
        const t = pickTotals();
        show('ok', '✓ ' + name + ' · ' + line.picked + '/' + line.need +
                   (t.picked === t.need ? ' · ORDER COMPLETE – press FINISH ORDER' : ''));
        flashPick(true);
      }
    }
    storePick();
    renderPick();
  }

  function pushPickUndo(entry) {
    pick.undo.push(entry);
    if (pick.undo.length > UNDO_MAX) pick.undo.shift();
    updateUndoButtons();
  }

  function undoPick() {
    if (blocked()) return;
    const u = pick.undo.pop();
    if (!u || !pick.lines[u.key]) { updateUndoButtons(); show('info', 'Nothing to undo.'); return; }
    const line = pick.lines[u.key];
    const name = stock[u.key] ? label(stock[u.key]) : 'EAN ' + line.ean;
    if (u.kind === 'pick') {
      line.picked = Math.max(0, line.picked - 1);
      show('ok', 'UNDO: one ' + name + ' put back (' + line.picked + '/' + line.need + ').');
    } else {
      line.need--;
      if (line.need <= 0) delete pick.lines[u.key];
      else line.picked = Math.min(line.picked, line.need);
      show('ok', 'UNDO: one ' + name + ' removed from the order.');
    }
    storePick();
    renderPick();
    updateUndoButtons();
    $('pickEan').focus();
  }

  function flashPick(good) {
    const t = $('pickTarget');
    t.classList.remove('good', 'bad');
    void t.offsetWidth; // restart the flash when scanning fast
    t.classList.add(good ? 'good' : 'bad');
    setTimeout(() => t.classList.remove('good', 'bad'), 700);
  }

  function pickLines() {
    return Object.keys(pick.lines).map(key => {
      const p = stock[key], l = pick.lines[key];
      return { key: key, ean: p ? p.ean : l.ean, need: l.need, picked: l.picked,
               name: p ? p.name : '', brand: p ? p.brand : '', location: p ? p.location : '', stock: p ? p.qty : null };
    }).sort((a, b) => byShelf(a.location, b.location));
  }

  function pickTotals() {
    return Object.values(pick.lines).reduce((t, l) => ({ need: t.need + l.need, picked: t.picked + l.picked }), { need: 0, picked: 0 });
  }

  function renderPick() {
    const lines = pickLines();
    const t = pickTotals();
    const picking = pick.phase === 'pick';
    $('pickListBtns').hidden = picking;
    $('pickPickBtns').hidden = !picking;
    $('pickLabel').textContent = picking ? 'Scan each product as you take it' : 'Scan the products from the packing list';
    $('pickColQty').textContent = picking ? 'Luat' : 'Buc';
    $('pickSum').textContent = !lines.length ? 'No products scanned yet.'
      : picking ? 'Order ' + pick.orderId + ' · picked ' + t.picked + ' / ' + t.need + ' pieces · sorted by raft'
                : lines.length + ' products · ' + t.need + ' pieces · sorted by raft';

    const next = lines.find(l => l.picked < l.need);
    $('pickTarget').hidden = !picking;
    $('pickTarget').classList.toggle('complete', picking && !next);
    if (picking) {
      if (next) {
        $('ptRaft').textContent = 'Raft ' + (next.location || '?');
        $('ptWhat').textContent = (next.name || '(not in stock list)') + (next.brand ? ' · ' + next.brand : '') + ' · EAN ' + next.ean;
        $('ptNeed').textContent = 'Take ' + (next.need - next.picked) + ' more  (' + next.picked + '/' + next.need + ')';
      } else {
        $('ptRaft').textContent = '✓ All picked';
        $('ptWhat').textContent = t.picked + ' pieces';
        $('ptNeed').textContent = 'Press FINISH ORDER to remove them from stock';
      }
    }

    $('pickRows').innerHTML = lines.map(l => {
      const short = l.stock === null || l.stock < l.need;
      const cls = picking ? (l.picked >= l.need ? 'done' : l === next ? 'cur' : short ? 'warn' : '') : (short ? 'warn' : '');
      return '<tr class="' + cls + '">' +
        '<td class="raft">' + esc(l.location || '?') + '</td>' +
        '<td>' + esc(l.name || '(not in stock list)') +
        (l.brand ? '<div class="br">' + esc(l.brand) + '</div>' : '') +
        '<div class="ean">EAN ' + esc(l.ean) + '</div></td>' +
        '<td class="num">' + (picking ? l.picked + '/' + l.need : l.need) + '</td>' +
        '<td class="num">' + (l.stock === null ? '-' : l.stock) + '</td></tr>';
    }).join('');
    updateUndoButtons();
  }

  function startPicking() {
    if (!Object.keys(pick.lines).length) { show('err', 'Scan the packing list first.'); return; }
    pick.phase = 'pick';
    if (!pick.orderId) {
      const d = new Date(), two = n => String(n).padStart(2, '0'); // phone's local time
      pick.orderId = 'CMD-' + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + '-' +
                     two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
    }
    storePick();
    renderPick();
    const next = pickLines().find(l => l.picked < l.need);
    show('info', 'Picking started. Go to raft ' + ((next && next.location) || '?') + ' and scan each piece you take.');
    $('pickEan').focus();
  }

  function backToList() {
    pick.phase = 'list';
    storePick();
    renderPick();
    show('info', 'Back to the list: scan more products, or UNDO to remove one. Picked pieces are kept.');
    $('pickEan').focus();
  }

  function clearPick() {
    const btn = pick.phase === 'pick' ? 'cancelPickBtn' : 'clearPickBtn';
    const text = pick.phase === 'pick' ? 'Cancel order' : 'Clear order';
    twoTap(btn, text, () => {
      pick = emptyPick();
      storePick();
      renderPick();
      show('info', 'Order cleared. Scan the next packing list.');
      $('pickEan').focus();
    });
  }

  function finishPick() {
    if (blocked() || !serverReady()) return;
    const t = pickTotals();
    if (!t.picked) { show('err', 'Nothing picked yet.'); return; }
    if (t.picked < t.need) {
      ask('warn', 'Not everything is picked: <b>' + t.picked + ' of ' + t.need + '</b> pieces.<br><br>' +
                  'Remove only the picked pieces from stock and close the order?',
        [{ label: 'YES, finish with what I picked', cls: 'yes', fn: doFinishPick },
         { label: 'NO, continue picking', cls: 'sec', fn: () => $('pickEan').focus() }]);
      return;
    }
    doFinishPick();
  }

  function doFinishPick() {
    const lines = pickLines();
    const orderId = pick.orderId;
    let pieces = 0;
    lines.forEach(l => {
      const p = stock[l.key];
      if (!l.picked || !p) return;
      const job = { id: ++seq, pick: true, ean: p.ean, d: -l.picked, orderId: orderId, applied: true };
      const before = p.qty;
      p.qty = before - l.picked;
      addRecent(recentEntry(job.id, p, 'PICK', -l.picked, before, p.qty, true));
      send(job);
      pieces += l.picked;
    });
    saveOrderRemote(lines.map(l => ({ ean: l.ean, count: l.picked,
      note: l.picked >= l.need ? 'Picked, removed from stock' : 'Picked ' + l.picked + ' of ' + l.need })), orderId, 0);
    pick = emptyPick();
    storePick();
    renderPick();
    show('ok', 'Order ' + orderId + ' finished: ' + pieces + ' pieces removed from stock.');
    $('pickEan').focus();
  }

  // The order is saved once (the server recognises the order id), so it is safe to try again.
  function saveOrderRemote(lines, orderId, attempt) {
    google.script.run
      .withSuccessHandler(() => {})
      .withFailureHandler(e => {
        if (e.transport && attempt < 6) { setTimeout(() => saveOrderRemote(lines, orderId, attempt + 1), 5000 * (attempt + 1)); return; }
        show('err', 'Stock was updated, but order ' + orderId + ' was NOT written to the Comenzi tab: ' + e.message);
      })
      .saveOrder(lines, orderId);
  }

  // ---------- MOD INVENTAR ----------
  // Choose a raft, scan everything on it (or type a quantity before a scan), press FINISH COUNT,
  // check the differences against the sheet, then APPLY CORRECTIONS sets the counted quantities.

  function emptyInv(shelf) { return { shelf: shelf || '', phase: 'count', counted: {}, undo: [] }; }
  let inv = emptyInv('');

  function storeInv() { keep('wmsInv', inv); }
  function restoreInv() {
    inv = load('wmsInv', null) || emptyInv('');
    inv.undo = inv.undo || [];
    if (inv.shelf) setSelect($('invShelf'), inv.shelf);
  }

  function invShelfChanged() {
    const shelf = $('invShelf').value;
    markShelf();
    if (shelf === inv.shelf) return;
    const n = Object.keys(inv.counted).length;
    const change = () => {
      inv = emptyInv(shelf);
      storeInv();
      renderInv();
      show('info', shelf ? 'Counting raft ' + shelf + '. Scan everything on it.' : 'Select the raft to count.');
      focusScan();
    };
    if (!n) { change(); return; }
    ask('warn', 'Start counting raft <b>' + esc(shelf || '-') + '</b>?<br><br>The current count of raft <b>' + esc(inv.shelf) +
                '</b> (' + n + ' products) will be cleared.',
      [{ label: 'YES, start a new count', cls: 'yes', fn: change },
       { label: 'NO, keep the current count', cls: 'sec', fn: () => { setSelect($('invShelf'), inv.shelf); markShelf(); focusScan(); } }]);
  }

  function invEntered() {
    clearTimeout(autoTimer);
    const ean = $('invEan').value.trim();
    $('invEan').value = '';
    if (!ean || blocked()) return;
    $('invEan').focus();
    invScan(ean);
  }

  function invScan(ean) {
    if (!inv.shelf) { show('err', 'Select the raft to count first.'); $('invShelf').focus(); return; }
    if (inv.phase === 'review') { show('err', 'Press "Back to counting" to scan more.'); return; }
    const raw = $('invQty').value.trim();
    const n = raw === '' ? 1 : Number(raw);
    if (!Number.isInteger(n) || n < 1 || raw.length >= MIN_EAN_LEN) {
      $('invQty').value = '';
      show('err', 'The quantity must be a whole number (1 or more). Type it again, then scan.');
      $('invQty').focus();
      return;
    }
    const key = norm(ean);
    const p = stock[key];
    const c = inv.counted[key] || { ean: p ? p.ean : ean, count: 0 };
    c.count += n;
    inv.counted[key] = c;
    inv.undo.push({ key: key, n: n });
    if (inv.undo.length > UNDO_MAX) inv.undo.shift();
    $('invQty').value = '';
    storeInv();
    renderInv();
    if (!p) {
      show('err', 'EAN ' + ean + ' is not in the stock list (counted: ' + c.count + ').');
      askAddProduct(ean, 0, inv.shelf);
    } else if (p.location.trim() && !sameShelf(p.location, inv.shelf)) {
      show('err', label(p) + ' is registered on raft ' + p.location + ', not ' + inv.shelf + ' (counted: ' + c.count + '). It will not be corrected here.');
    } else {
      show('ok', '✓ ' + label(p) + ' · counted ' + c.count + (n > 1 ? ' (+' + n + ')' : ''));
    }
  }

  function undoInv() {
    if (blocked()) return;
    const u = inv.undo.pop();
    if (!u || !inv.counted[u.key]) { updateUndoButtons(); show('info', 'Nothing to undo.'); return; }
    const c = inv.counted[u.key];
    c.count -= u.n;
    const name = stock[u.key] ? label(stock[u.key]) : 'EAN ' + c.ean;
    if (c.count <= 0) delete inv.counted[u.key];
    storeInv();
    renderInv();
    show('ok', 'UNDO: −' + u.n + ' ' + name + ' (counted: ' + Math.max(0, c.count) + ').');
    focusScan();
  }

  // Products registered on the raft plus everything scanned there.
  function invLines() {
    const keys = new Set(Object.keys(inv.counted));
    if (inv.shelf) Object.keys(stock).forEach(k => { if (sameShelf(stock[k].location, inv.shelf)) keys.add(k); });
    return [...keys].map(key => {
      const p = stock[key], c = inv.counted[key];
      const counted = c ? c.count : 0;
      return { key: key, ean: p ? p.ean : c.ean, name: p ? p.name : '', brand: p ? p.brand : '',
               location: p ? p.location : '', sheet: p ? p.qty : null, counted: counted,
               unknown: !p, other: !!(p && p.location.trim() && !sameShelf(p.location, inv.shelf)),
               diff: p ? counted - p.qty : 0 };
    }).sort((a, b) => (a.name || a.ean).localeCompare(b.name || b.ean));
  }

  function renderInv() {
    const lines = invLines();
    const review = inv.phase === 'review';
    $('invCountBtns').hidden = review;
    $('invReviewBtns').hidden = !review;
    if (!inv.shelf) {
      $('invSum').textContent = 'Select the raft to count.';
      $('invHead').innerHTML = '';
      $('invRows').innerHTML = '';
      updateUndoButtons();
      return;
    }
    const pieces = Object.values(inv.counted).reduce((s, c) => s + c.count, 0);
    const fix = lines.filter(l => !l.unknown && !l.other && l.diff !== 0);
    const shown = review ? lines.filter(l => l.unknown || l.other || l.diff !== 0) : lines;
    $('invSum').textContent = review
      ? 'Raft ' + inv.shelf + ': ' + fix.length + ' difference' + (fix.length === 1 ? '' : 's') + ' to correct' +
        (lines.length - fix.length ? ' · ' + (lines.length - fix.length) + ' products match or are not corrected' : '')
      : 'Raft ' + inv.shelf + ': ' + lines.filter(l => !l.other).length + ' products · ' + pieces + ' pieces counted';
    $('invHead').innerHTML = '<tr><th>Produs</th><th style="text-align:right">Foaie</th><th style="text-align:right">Numărat</th>' +
                             (review ? '<th style="text-align:right">Dif.</th>' : '') + '</tr>';
    $('invRows').innerHTML = shown.length ? shown.map(l => {
      const cls = l.unknown || l.other ? 'other' : review ? 'warn' : (inv.counted[l.key] ? (l.diff === 0 ? 'done' : 'cur') : '');
      const note = l.unknown ? 'not in stock list – not corrected'
                 : l.other ? 'registered on raft ' + l.location + ' – not corrected' : '';
      return '<tr class="' + cls + '">' +
        '<td>' + esc(l.name || '(unknown)') + (l.brand ? '<div class="br">' + esc(l.brand) + '</div>' : '') +
        '<div class="ean">EAN ' + esc(l.ean) + (note ? ' · ' + esc(note) : '') + '</div></td>' +
        '<td class="num">' + (l.sheet === null ? '-' : l.sheet) + '</td>' +
        '<td class="num">' + l.counted + '</td>' +
        (review ? '<td class="num ' + (l.diff > 0 ? 'plus' : 'minus') + '">' + (l.unknown || l.other ? '' : (l.diff > 0 ? '+' : '') + l.diff) + '</td>' : '') +
        '</tr>';
    }).join('') : '<tr><td colspan="4" class="empty">' + (review ? 'No differences.' : 'Nothing counted yet.') + '</td></tr>';
    $('applyInvBtn').textContent = 'APPLY CORRECTIONS (' + fix.length + ')';
    updateUndoButtons();
  }

  function finishInv() {
    if (!inv.shelf) { show('err', 'Select the raft to count first.'); return; }
    if (!Object.keys(inv.counted).length && !invLines().length) { show('err', 'Nothing counted yet.'); return; }
    inv.phase = 'review';
    storeInv();
    renderInv();
    const fix = invLines().filter(l => !l.unknown && !l.other && l.diff !== 0).length;
    show('info', fix ? 'Check the differences. Products registered on this raft that you did not scan are counted as 0. ' +
                       'Press APPLY CORRECTIONS to set the sheet to the counted quantities.'
                     : 'No differences: raft ' + inv.shelf + ' matches the sheet.');
  }

  function backToCount() {
    inv.phase = 'count';
    storeInv();
    renderInv();
    show('info', 'Counting raft ' + inv.shelf + ' again: scan more products.');
    focusScan();
  }

  function applyInv() {
    if (blocked() || !serverReady()) return;
    const fix = invLines().filter(l => !l.unknown && !l.other && l.diff !== 0);
    fix.forEach(l => {
      const p = stock[l.key];
      const job = { id: ++seq, count: true, ean: p.ean, qty: l.counted, loc: inv.shelf, d: l.counted - p.qty, applied: true };
      const before = p.qty;
      if (!p.location.trim()) { p.location = inv.shelf; job.locSet = true; }
      p.qty = l.counted;
      addRecent(recentEntry(job.id, p, 'INVENTAR', l.counted - before, before, l.counted, true));
      send(job);
    });
    const shelf = inv.shelf;
    inv = emptyInv(shelf);
    storeInv();
    renderInv();
    show('ok', fix.length ? 'Inventory raft ' + shelf + ': ' + fix.length + ' correction' + (fix.length === 1 ? '' : 's') + ' saved (type INVENTAR in the Log).'
                          : 'Inventory raft ' + shelf + ': no differences, nothing to correct.');
    focusScan();
  }

  function clearInv() {
    twoTap('clearInvBtn', 'Clear count', () => {
      inv = emptyInv(inv.shelf);
      storeInv();
      renderInv();
      show('info', 'Count cleared. Scan raft ' + (inv.shelf || '-') + ' again.');
      focusScan();
    });
  }

  // ---------- inputs ----------

  function autoApply(input, fn) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); fn(); }
    });
    input.addEventListener('input', () => {
      clearTimeout(autoTimer);
      const v = input.value.trim();
      if (/^\d+$/.test(v) && v.length >= MIN_EAN_LEN) autoTimer = setTimeout(fn, AUTO_DELAY_MS);
    });
  }
  autoApply($('ean'), eanEntered);
  autoApply($('pickEan'), pickEntered);
  autoApply($('invEan'), invEntered);
  $('manualQty').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); manualApply(); } });
  $('invQty').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('invEan').focus(); } });
  $('shelf').addEventListener('change', () => {
    markShelf();
    if ($('shelf').value) { show('info', 'Raft ' + $('shelf').value + ' selected. Scan EAN.'); focusScan(); }
  });
  $('invShelf').addEventListener('change', invShelfChanged);
  $('newName').addEventListener('keydown', e => { if (e.key === 'Enter') $('newBrand').focus(); });
  $('newBrand').addEventListener('keydown', e => { if (e.key === 'Enter') $('newLoc').focus(); });
  $('newQty').addEventListener('keydown', e => { if (e.key === 'Enter') saveNew(); });
  // While a question is open, keys from the scanner (including its Enter) must not answer it.
  $('dlgBox').addEventListener('keydown', e => e.preventDefault());

  // ---------- camera scanning (a USB/Bluetooth scanner works without this) ----------
  // Battery: the camera only looks for a barcode while SCAN is pressed (up to 2.5 s), and switches
  // itself off after 90 seconds without a SCAN. When it reads, it reads at high resolution with
  // continuous focus, and only the strip shown on screen (plus a margin), for speed and accuracy.
  const CAM_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
  const ZOOM_STEPS = [1, 1.5, 2, 3];
  const SCAN_WINDOW_MS = 2500;
  const CAM_IDLE_MS = 90000;
  let cam = null;          // running camera: { stream, track, detector, raf, busy, scanning, deadline, caps, zoom, torch, idle }
  let camStarting = false;
  let detectorPromise = null;
  const camCanvas = document.createElement('canvas');
  const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

  // Android Chrome has a fast built-in barcode reader; other phones (iPhone) use the ZXing engine.
  // Some phones announce a built-in reader that does not actually work (e.g. without Google Play
  // services), so it is tried once on a small picture before it is trusted.
  function getDetector() {
    if (!detectorPromise) {
      detectorPromise = (async () => {
        if ('BarcodeDetector' in window) {
          try {
            const supported = await window.BarcodeDetector.getSupportedFormats();
            const formats = CAM_FORMATS.filter(f => supported.includes(f));
            if (formats.includes('ean_13')) {
              const det = new window.BarcodeDetector({ formats: formats });
              const probe = document.createElement('canvas');
              probe.width = probe.height = 16;
              await det.detect(probe);
              return det;
            }
          } catch (e) {}
        }
        if (window.BarcodeDetectionAPI) return new window.BarcodeDetectionAPI.BarcodeDetector({ formats: CAM_FORMATS });
        throw new Error('the barcode reader did not load (check the internet connection)');
      })();
      detectorPromise.catch(() => { detectorPromise = null; });
    }
    return detectorPromise;
  }

  function camPref(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key) || '';
      localStorage.setItem(key, value);
    } catch (e) { return ''; }
  }

  async function toggleCamera() {
    if (cam) { stopCamera(); return; }
    await startCamera(camPref('wmsCamera'));
    if (cam) show('info', 'Camera on. Aim the red line at the barcode and press SCAN.');
  }

  // Green SCAN button: starts the camera if needed, then looks for a barcode for up to 2.5 seconds.
  async function scanPress() {
    audio();
    if (blocked()) return;
    if (!cam) {
      if (camStarting) return;
      await startCamera(camPref('wmsCamera'));
      if (!cam) return;
    }
    armIdle();
    if (cam.scanning) return;
    cam.scanning = true;
    cam.deadline = performance.now() + SCAN_WINDOW_MS;
    $('scanBtn').classList.add('busy');
    $('scanBtn').textContent = 'SCANNING…';
    cam.raf = requestAnimationFrame(scanFrame);
  }

  function endScan() {
    if (cam) { cam.scanning = false; cancelAnimationFrame(cam.raf); }
    $('scanBtn').classList.remove('busy');
    $('scanBtn').textContent = 'SCAN';
  }

  function armIdle() {
    if (!cam) return;
    clearTimeout(cam.idle);
    cam.idle = setTimeout(() => {
      stopCamera();
      show('info', 'Camera switched off to save battery. Press SCAN to scan again.');
    }, CAM_IDLE_MS);
  }

  async function startCamera(deviceId) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { show('err', 'Camera not available in this browser.'); return; }
    camStarting = true;
    $('reader').hidden = false;
    $('scanBtn').textContent = 'STARTING CAMERA…';
    try {
      const detector = await getDetector();
      const video = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 24, max: 30 } };
      if (deviceId) video.deviceId = { exact: deviceId }; else video.facingMode = { ideal: 'environment' };
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video });
      } catch (e) {
        if (!deviceId) throw e;
        camPref('wmsCamera', ''); // the saved camera is not available any more: use the default back camera
        camStarting = false;
        return startCamera('');
      }
      const v = $('camVideo');
      v.srcObject = stream;
      await v.play();
      cam = { stream: stream, track: stream.getVideoTracks()[0], detector: detector, raf: 0, busy: false,
              scanning: false, deadline: 0, caps: {}, zoom: 1, torch: false, idle: null };
      await tuneCamera();
      setupSwitch();
      armIdle();
    } catch (err) {
      stopCamera();
      show('err', 'Camera not available: ' + ((err && err.message) || err));
    } finally {
      camStarting = false;
      if (!cam || !cam.scanning) $('scanBtn').textContent = 'SCAN';
    }
  }

  function stopCamera() {
    endScan();
    if (cam) {
      clearTimeout(cam.idle);
      cam.stream.getTracks().forEach(t => t.stop());
    }
    cam = null;
    $('camVideo').srcObject = null;
    $('reader').hidden = true;
    $('reader').classList.remove('hit');
  }

  // Continuous focus and a little zoom (lets the phone stay far enough away to focus),
  // where the phone allows it. iPhones mostly ignore these settings.
  async function tuneCamera() {
    const t = cam.track;
    const caps = cam.caps = (t.getCapabilities ? t.getCapabilities() : {}) || {};
    const adv = {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
    if (caps.zoom) {
      const wanted = Number(camPref('wmsZoom')) || 1.5;
      cam.zoom = adv.zoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, wanted));
    }
    try { if (Object.keys(adv).length) await t.applyConstraints({ advanced: [adv] }); } catch (e) {}
    $('zoomBtn').hidden = !caps.zoom;
    $('zoomBtn').textContent = cam.zoom + '×';
    $('torchBtn').hidden = !caps.torch;
    $('torchBtn').classList.remove('on');
  }

  async function nextZoom() {
    if (!cam || !cam.caps.zoom) return;
    armIdle();
    const z = cam.caps.zoom;
    const steps = ZOOM_STEPS.filter(s => s >= z.min && s <= z.max);
    const next = steps[(steps.indexOf(cam.zoom) + 1) % steps.length] || z.min;
    try {
      await cam.track.applyConstraints({ advanced: [{ zoom: next }] });
      cam.zoom = next;
      camPref('wmsZoom', String(next));
      $('zoomBtn').textContent = next + '×';
    } catch (e) {}
  }

  async function toggleTorch() {
    if (!cam) return;
    armIdle();
    try {
      await cam.track.applyConstraints({ advanced: [{ torch: !cam.torch }] });
      cam.torch = !cam.torch;
      $('torchBtn').classList.toggle('on', cam.torch);
    } catch (e) {}
  }

  // Phones with several back cameras (wide, ultra-wide, tele): 🔄 goes to the next one and remembers it.
  let backCameras = [];
  async function setupSwitch() {
    try {
      const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const back = all.filter(d => /back|rear|environment|spate|arri/i.test(d.label));
      backCameras = back.length ? back : all;
    } catch (e) { backCameras = []; }
    $('switchBtn').hidden = backCameras.length < 2;
  }

  async function switchCamera() {
    if (!cam || backCameras.length < 2) return;
    const current = cam.track.getSettings ? cam.track.getSettings().deviceId : '';
    const i = backCameras.findIndex(d => d.deviceId === current);
    const next = backCameras[(i + 1) % backCameras.length];
    camPref('wmsCamera', next.deviceId);
    stopCamera();
    await startCamera(next.deviceId);
    show('info', 'Camera ' + (backCameras.indexOf(next) + 1) + ' of ' + backCameras.length +
                 (next.label ? ' (' + next.label + ')' : '') + '. Keep the one that focuses best.');
  }

  // Part of the camera picture visible in the strip, made twice as tall so a barcode a bit
  // above or below the red line is still read.
  function stripRegion(v) {
    const vw = v.videoWidth, vh = v.videoHeight;
    const ew = v.clientWidth, eh = v.clientHeight;
    if (!ew || !eh) return { x: 0, y: 0, w: vw, h: vh }; // size on screen not known yet: read the whole picture
    const s = Math.max(ew / vw, eh / vh);   // same scaling as object-fit: cover
    const w = Math.min(vw, ew / s);
    const h = Math.min(vh, (eh / s) * 2);
    return { x: Math.round((vw - w) / 2), y: Math.round((vh - h) / 2), w: Math.round(w), h: Math.round(h) };
  }

  async function scanFrame() {
    if (!cam || !cam.scanning) return;
    if (performance.now() > cam.deadline) {
      endScan();
      show('info', 'No barcode found. Hold the phone 15–25 cm away with the red line across the barcode, then press SCAN again.');
      return;
    }
    const v = $('camVideo');
    if (!cam.busy && v.readyState >= 2 && v.videoWidth) {
      cam.busy = true;
      try {
        const r = stripRegion(v);
        camCanvas.width = r.w;
        camCanvas.height = r.h;
        camCtx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
        const found = await cam.detector.detect(camCanvas);
        if (found.length && cam && cam.scanning) {
          cam.busy = false;
          endScan();
          cameraCode(found[0].rawValue);
          return;
        }
      } catch (e) {}
      if (cam) cam.busy = false;
    }
    if (cam && cam.scanning) cam.raf = requestAnimationFrame(scanFrame);
  }

  function cameraCode(code) {
    $('reader').classList.add('hit');
    setTimeout(() => $('reader').classList.remove('hit'), 300);
    if (blocked()) return;
    if (mode === 'pick') { pickScan(code); return; }
    if (mode === 'inv') { invScan(code); return; }
    $('ean').value = code;
    eanEntered();
  }

  // The phone stops the camera when the page goes to the background; tidy up so SCAN starts it again cleanly.
  document.addEventListener('visibilitychange', () => { if (document.hidden && cam) stopCamera(); });

  // ---------- start ----------
  restoreQueue();
  restorePick();
  restoreInv();
  placeCamera();
  renderPick();
  renderInv();
  updateUndoButtons();
  markShelf();
  setSync();
  if (session.token) startApp(); else showLogin('');
</script>
</body>
</html>
